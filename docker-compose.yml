# One-command local stack (spec §4). See docs/docker-readiness.md for the
# static contract audit and runtime smoke check.
services:
  backend:
    build: ./backend
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --app-dir /app
    volumes:
      - ./backend:/app
      - ./datasets:/datasets
      - ./tests:/tests
    environment:
      - AURORA_TAXONOMY=/datasets/taxonomy/taxonomy.json
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      - AURORA_API_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
