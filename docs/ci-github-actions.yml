# Copy this file to .github/workflows/ci.yml to enable GitHub Actions.
# (Pushing workflows requires a token with the `workflow` OAuth scope.)
#
#   mkdir -p .github/workflows
#   cp docs/ci-github-actions.yml .github/workflows/ci.yml
#
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check-all:
    name: check-all (Python ${{ matrix.python-version }}, ${{ matrix.gate }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            gate: engine
            requirements: backend/requirements-engine-test.txt
            check_args: --engine-only
          - python-version: "3.11"
            gate: full
            requirements: backend/requirements.txt
            check_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ${{ matrix.requirements }}

      - name: Set up Node
        if: matrix.gate == 'full'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: matrix.gate == 'full'
        run: npm ci --prefix frontend

      - name: check-all
        env:
          PYTHONPATH: backend:.
        run: python scripts/check_all.py ${{ matrix.check_args }}

      - name: Engine version sanity
        env:
          PYTHONPATH: backend
        run: |
          python -c "from aurora import __version__; from aurora.config import ENGINE_VERSION; assert __version__ == ENGINE_VERSION, (__version__, ENGINE_VERSION); print('engine', ENGINE_VERSION)"
